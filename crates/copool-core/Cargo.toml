[package]
name = "copool-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
default = []

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "stream", "rustls-tls", "socks"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
axum = "0.7"
async-stream = "0.3"
tempfile = "3"
flate2 = "1"
toml_edit = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("desktop"))'] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-async-persistent", "crypto-rust", "tokio"] }
