<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Copool</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="top" data-tauri-drag-region>
        <div id="top-main" class="top-row" data-tauri-drag-region>
          <span class="app-name">Copool</span>
          <nav class="links" aria-label="Sections">
            <button
              class="text-link"
              data-page="proxy"
              aria-selected="false"
              data-l10n="tab.proxy"
            ></button
            ><button
              class="text-link"
              data-page="settings"
              aria-selected="false"
              data-l10n="tab.settings"
            ></button
            ><button
              id="quit"
              class="text-link"
              data-l10n="common.quit"
            ></button>
          </nav>
        </div>
        <div id="top-sub" class="top-row" data-tauri-drag-region hidden>
          <button
            class="text-link back"
            data-page="accounts"
            aria-selected="true"
            aria-keyshortcuts="Meta+["
          >
            <span data-icon="chevron-left"></span
            ><span data-l10n="tab.accounts"></span>
          </button>
          <span id="page-title" class="page-title"></span>
        </div>
      </header>
      <div id="notice" role="status" aria-live="polite" hidden>
        <span class="message-dot"></span><span id="notice-text"></span
        ><button id="notice-close" class="icon-btn" aria-label="Dismiss">
          <span data-icon="close"></span>
        </button>
      </div>
      <main>
        <section id="accounts-page" class="content">
          <div class="page">
            <div class="toolbar">
              <button id="usage-toggle" class="icon-btn"></button>
              <button
                id="import-open"
                class="btn quiet"
                aria-haspopup="menu"
              ></button>
              <button id="add-account" class="btn quiet"></button>
              <button
                id="smart-switch"
                class="btn quiet"
                data-l10n="accounts.action.smart_switch"
              ></button>
              <span class="toolbar-aside">
                <button
                  id="refresh-all"
                  class="icon-btn"
                  data-title="common.refresh_usage"
                >
                  <span data-icon="refresh"></span>
                </button>
                <button id="collapse-all" class="icon-btn"></button>
              </span>
            </div>
            <div id="pending-workspaces"></div>
            <div id="accounts" class="account-list"></div>
          </div>
        </section>
        <section id="proxy-page" class="content" hidden>
          <div class="page">
            <section class="block" id="api-section">
              <div class="block-head">
                <span
                  class="block-title"
                  data-l10n="proxy.section.api_proxy"
                ></span>
                <span class="block-aside">
                  <span id="proxy-status" class="state"
                    ><span class="dot"></span><span id="proxy-state"></span
                  ></span>
                  <button
                    id="proxy-refresh"
                    class="icon-btn"
                    data-title="common.refresh"
                  >
                    <span data-icon="refresh"></span></button
                  ><button
                    class="icon-btn disclosure"
                    data-target="api-details"
                    aria-expanded="false"
                  >
                    <span data-icon="chevron-down"></span>
                  </button>
                </span>
              </div>
              <div class="strip">
                <span id="proxy-port-status" class="stat-value"></span
                ><span id="proxy-count" class="stat-value"></span>
              </div>
              <div id="api-details" class="section-details" hidden>
                <div class="row">
                  <span class="row-label">Port</span>
                  <span class="number-field"
                    ><input
                      id="proxy-port"
                      class="field"
                      inputmode="numeric"
                      type="number"
                      min="1"
                      max="65535"
                      placeholder="8787"
                      aria-label="Port"
                  /></span>
                  <button
                    id="proxy-start"
                    class="btn quiet prominent"
                    data-l10n="common.start"
                  ></button
                  ><button
                    id="proxy-stop"
                    class="btn quiet destructive"
                    data-l10n="common.stop"
                  ></button>
                </div>
                <label class="row"
                  ><span
                    class="row-label"
                    data-l10n="proxy.start_on_launch"
                  ></span
                  ><input
                    id="proxy-auto-start"
                    type="checkbox"
                    class="switch"
                    data-preference="autoStartProxy"
                /></label>
                <div class="subhead" data-l10n="proxy.detail.base_url"></div>
                <div class="copy-row">
                  <input id="proxy-url" class="field" readonly /><button
                    class="icon-btn copy"
                    data-copy="proxy-url"
                    data-title="common.copy"
                  >
                    <span data-icon="copy"></span>
                  </button>
                </div>
                <div class="subhead" data-l10n="proxy.detail.api_key"></div>
                <div class="copy-row">
                  <input
                    id="proxy-key"
                    class="field"
                    readonly
                    type="password"
                    autocomplete="off"
                  /><button
                    id="toggle-key"
                    class="icon-btn"
                    aria-label="Show API key"
                  >
                    <span data-icon="eye"></span></button
                  ><button
                    class="icon-btn copy"
                    data-copy="proxy-key"
                    data-title="common.copy"
                  >
                    <span data-icon="copy"></span>
                  </button>
                </div>
                <dl class="kv">
                  <dt data-l10n="proxy.detail.active_routed_account"></dt>
                  <dd>
                    <div id="proxy-active"></div>
                    <small id="proxy-active-id" class="secondary"></small>
                  </dd>
                  <dt data-l10n="proxy.detail.last_error"></dt>
                  <dd id="proxy-error"></dd>
                </dl>
              </div>
            </section>
            <section class="block">
              <div class="block-head">
                <span
                  class="block-title"
                  data-l10n="proxy.section.remote_servers"
                ></span>
                <span class="block-aside">
                  <button
                    id="remote-add"
                    class="btn quiet"
                    data-l10n="proxy.action.add_server"
                  ></button>
                </span>
              </div>
              <p
                class="setting-description"
                data-l10n="proxy.remote.description"
              ></p>
              <div id="remote-list"></div>
              <div id="remote-empty" class="placeholder">
                <span class="row-name" data-l10n="proxy.remote.empty.title"></span>
                <span
                  class="setting-description"
                  data-l10n="proxy.remote.empty.message"
                ></span>
              </div>
            </section>
            <section class="block">
              <div class="block-head">
                <span
                  class="block-title"
                  data-l10n="proxy.section.public_access"
                ></span>
                <span class="block-aside">
                  <button
                    class="icon-btn disclosure"
                    data-target="public-details"
                    aria-expanded="false"
                  >
                    <span data-icon="chevron-down"></span>
                  </button>
                </span>
              </div>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="proxy.toggle.enable_public_access"
                ></span
                ><input
                  id="public-enabled"
                  type="checkbox"
                  class="switch"
                  data-tunnel="enabled"
              /></label>
              <div id="public-details" class="section-details" hidden>
                <div id="tunnel-controls"></div>
                <div class="value-card message warn">
                  <span class="message-dot"></span>
                  <div class="message-body">
                    <div
                      class="row-name"
                      data-l10n="proxy.public.callout.start_local_first_title"
                    ></div>
                    <div
                      class="secondary"
                      data-l10n="proxy.public.callout.start_local_first_message"
                    ></div>
                  </div>
                </div>
                <div class="value-card message">
                  <span class="message-dot"></span>
                  <div class="message-body">
                    <div
                      class="row-name"
                      data-l10n="proxy.public.install_title"
                    ></div>
                    <div
                      class="secondary"
                      data-l10n="proxy.public.install_message"
                    ></div>
                    <div class="message-actions">
                      <button
                        class="btn quiet"
                        id="tunnel-install"
                        data-l10n="proxy.public.install_action"
                      ></button>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>
        <section id="settings-page" class="content settings-page" hidden>
          <div class="page">
            <section class="block">
              <div class="block-head">
                <span
                  class="block-title"
                  data-l10n="settings.section.general"
                ></span>
              </div>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.launch_at_startup"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="launchAtStartup"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.launch_codex_after_switch"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="launchCodexAfterSwitch"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.auto_start_api_proxy"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="autoStartProxy"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.local_proxy_host_api_only"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="hostApiOnly"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.usage_progress_display"
                ></span
                ><select id="usage-display" class="select">
                  <option
                    value="used"
                    data-l10n="settings.usage_progress_display.used"
                  ></option>
                  <option
                    value="remaining"
                    data-l10n="settings.usage_progress_display.remaining"
                  ></option></select
              ></label>
              <label class="row"
                ><span class="row-label" data-l10n="settings.language"></span
                ><select id="language" class="select"></select
              ></label>
            </section>
            <section class="block">
              <div class="block-head">
                <span
                  class="block-title"
                  data-l10n="settings.section.switch_behavior"
                ></span>
              </div>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.auto_smart_switch"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="autoSwitch"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.sync_opencode_openai_auth"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="syncOpencodeOpenaiAuth"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.restart_editors_on_switch"
                ></span
                ><input
                  type="checkbox"
                  class="switch"
                  data-preference="restartEditorsOnSwitch"
              /></label>
              <label class="row"
                ><span
                  class="row-label"
                  data-l10n="settings.editor_restart_target"
                ></span
                ><select id="restart-target" class="select" disabled>
                  <option data-l10n="common.none"></option></select
              ></label>
            </section>
            <section class="block">
              <div class="block-head">
                <span
                  class="block-title"
                  data-l10n="settings.section.sub2api"
                ></span>
                <span class="block-aside">
                  <span id="provider-count">0</span>
                  <button
                    class="btn quiet"
                    id="provider-add"
                    data-l10n="settings.sub2api.add_provider"
                  ></button>
                </span>
              </div>
              <div id="provider-forms"></div>
            </section>
          </div>
        </section>
      </main>
    </div>
    <dialog id="login-dialog">
      <h2 data-l10n="accounts.action.add_account"></h2>
      <p
        class="secondary"
        data-l10n="accounts.action.waiting_for_login"
      ></p>
      <div class="dialog-actions">
        <button id="login-cancel" class="btn" data-l10n="common.cancel"></button>
      </div>
    </dialog>
    <dialog id="edit-dialog">
      <form id="edit-form">
        <h2 data-l10n="accounts.proxy.title"></h2>
        <p id="edit-name" class="secondary"></p>
        <input
          id="edit-proxy"
          class="field"
          placeholder="http://127.0.0.1:7890"
          aria-label="Proxy URL"
        />
        <p
          id="edit-proxy-help"
          class="setting-description"
          data-l10n="settings.sub2api.proxy_help"
        ></p>
        <p id="edit-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button
            type="button"
            id="edit-cancel"
            class="btn"
            data-l10n="common.cancel"
          ></button
          ><button
            type="submit"
            class="btn primary"
            data-l10n="common.save"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-description" class="secondary"></p>
        <div class="dialog-actions">
          <button value="cancel" class="btn" data-l10n="common.cancel"></button
          ><button id="confirm-accept" value="confirm" class="btn primary"></button>
        </div>
      </form>
    </dialog>
    <script src="locales.js" defer></script>
    <script src="presentation.js" defer></script>
    <script src="controllers.js" defer></script>
    <script src="app.js" defer></script>
    <script src="features.js" defer></script>
  </body>
</html>
